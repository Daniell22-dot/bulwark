name: Alert Check

on:
  schedule:
    - cron: '*/15 * * * *'   # every 15 minutes
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Check for critical alerts
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          import json
          import sys
          from datetime import datetime, timezone, timedelta

          try:
              with open('data/telemetry.json') as f:
                  data = json.load(f)
          except (OSError, ValueError):
              sys.exit(0)

          now = datetime.now(timezone.utc)
          window = timedelta(minutes=20)
          alerts = []
          for t in data.get('telemetry', []):
              try:
                  received = datetime.fromisoformat(t['received_at'].replace('Z', '+00:00'))
              except (KeyError, TypeError, ValueError):
                  continue
              if now - received > window:
                  continue
              try:
                  events = json.loads(t.get('events_json', '[]'))
              except (TypeError, ValueError):
                  events = []
              if not isinstance(events, list):
                  continue
              for e in events:
                  if e.get('severity') == 'critical':
                      alerts.append("🚨 **{0}** ({1}): {2}".format(
                          t.get('agent_id', 'unknown'),
                          t.get('host', '?'),
                          e.get('message', 'critical event')))

          if alerts:
              issue_body = "## Bulwark Alert — {0} critical events in last 20 min\n{1}\n\n*Auto-generated at {2}*".format(
                  len(alerts), "\n".join(alerts), now.isoformat())
              print('ALERT_TRIGGERED=true')
              print('ALERT_BODY<<EOF')
              print(issue_body)
              print('EOF')
          PY
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Create alert issue
        if: env.ALERT_TRIGGERED == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const { ALERT_BODY } = process.env;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 Bulwark Alert: ${new Date().toISOString()}`,
              body: ALERT_BODY,
              labels: ['alert', 'bulwark', 'critical']
            });