name: Refresh threat-intel snapshot

# Keeps data/blocklist.json fresh so /check works even when the engine/server
# is offline. Uses only keyless public community feeds — no secrets required.

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh-intel
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Rebuild snapshot
        run: python scripts/build-blocklist.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/blocklist.json
          if git diff --cached --quiet; then
            echo "snapshot unchanged"
          else
            git commit -m "chore: refresh threat-intel snapshot [skip ci]"
            git push
          fi
