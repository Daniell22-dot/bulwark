name: Security Code Scanning (SAST + Container + IaC)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 4 * * 0'  # Weekly Sunday 04:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  sast:
    name: Static Analysis (CodeQL)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript]
    steps:
      - uses: actions/checkout@v4
      
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: +security-and-quality
      
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{matrix.language}}"
  
  container-scan:
    name: Container Vulnerability Scan
    runs-on: ubuntu-latest
    if: hashFiles('**/Dockerfile') != '' || hashFiles('**/docker-compose*.yml') != ''
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build image
        run: |
          docker build -t bulwark-scan:latest -f backend/Dockerfile backend/
      
      - name: Run Trivy scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: bulwark-scan:latest
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
      
      - name: Upload Trivy results to Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
  
  iac-scan:
    name: Infrastructure as Code Scan
    runs-on: ubuntu-latest
    if: hashFiles('**/*.tf') != '' || hashFiles('**/*.tfvars') != '' || hashFiles('.github/workflows/*.yml') != ''
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      
      - name: Run tfsec (Terraform)
        if: hashFiles('**/*.tf') != ''
        uses: aquasecurity/tfsec-action@v1
        with:
          format: sarif
          output: tfsec-results.sarif
      
      - name: Run checkov (Terraform, CloudFormation, K8s, Helm, Dockerfile)
        uses: bridgecrewio/checkov-action@master
        with:
          framework: all
          output_format: sarif
          output_file_path: checkov-results.sarif
          skip_check: CKV_DOCKER_3
      
      - name: Upload tfsec results
        if: hashFiles('tfsec-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: tfsec-results.sarif
      
      - name: Upload checkov results
        if: hashFiles('checkov-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: checkov-results.sarif
  
  secrets-scan:
    name: Secret Detection (TruffleHog)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: main
          head: HEAD
          format: json
      
      - name: Upload findings
        uses: actions/upload-artifact@v4
        with:
          name: trufflehog-findings
          path: trufflehog-results.json
          retention-days: 30
  
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          config-file: '.github/dependency-review-config.yml'
          fail-on-severity: high

  summary:
    name: Security Scan Summary
    runs-on: ubuntu-latest
    needs: [sast, container-scan, iac-scan, secrets-scan, dependency-review]
    if: always()
    steps:
      - name: Post summary
        run: |
          echo "## Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Scan | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| CodeQL (Python) | ${{ needs.sast.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| CodeQL (JavaScript) | ${{ needs.sast.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Container (Trivy) | ${{ needs.container-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| IaC (tfsec/checkov) | ${{ needs.iac-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Secrets (TruffleHog) | ${{ needs.secrets-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Dependency Review | ${{ needs.dependency-review.result }} |" >> $GITHUB_STEP_SUMMARY