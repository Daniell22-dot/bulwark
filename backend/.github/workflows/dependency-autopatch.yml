name: Dependency Vulnerability Autopatcher

on:
  schedule:
    - cron: '0 3 * * 1'  # Weekly Monday 03:00 UTC
  workflow_dispatch:
    inputs:
      auto_merge:
        description: 'Auto-merge PR if tests pass'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  security-events: write
  actions: read

jobs:
  autopatch:
    name: Scan & Auto-patch Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Install deps
        run: |
          pip install pip-audit safety pipdeptree
      
      - name: Audit Python dependencies
        id: audit
        run: |
          # Run pip-audit and capture results
          pip-audit --format=json --output=audit.json || true
          cat audit.json
          
          # Check for vulnerabilities
          VULN_COUNT=$(jq '.vulnerabilities | length' audit.json)
          echo "vulnerabilities=$VULN_COUNT" >> $GITHUB_OUTPUT
          
          if [ "$VULN_COUNT" -gt 0 ]; then
            echo "VULNERABLE=true" >> $GITHUB_OUTPUT
            # Extract fixable vulns
            jq -r '.vulnerabilities[] | select(.fix_versions != null) | "\(.package) \(.installed_version) -> \(.fix_versions[0])"' audit.json > fixable.txt
            cat fixable.txt
          else
            echo "VULNERABLE=false" >> $GITHUB_OUTPUT
      
      - name: Audit Node.js dependencies (if package.json exists)
        if: hashFiles('package.json') != ''
        run: |
          npm audit --json > npm_audit.json || true
          cat npm_audit.json
          VULN_COUNT=$(jq '[.vulnerabilities[] | select(.severity == "high" or .severity == "critical")] | length' npm_audit.json)
          echo "npm_vulnerabilities=$VULN_COUNT" >> $GITHUB_OUTPUT
      
      - name: Create patch branch
        if: steps.audit.outputs.VULNERABLE == 'true'
        id: patch
        run: |
          BRANCH="autopatch/$(date +%Y%m%d-%H%M%S)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b $BRANCH
          
          # Apply fixes for Python
          if [ -f fixable.txt ]; then
            while read -r line; do
              PKG=$(echo $line | awk '{print $1}')
              FIX=$(echo $line | awk '{print $3}')
              echo "Upgrading $PKG to $FIX"
              pip install --upgrade "$PKG==$FIX"
            done < fixable.txt
            pip freeze > requirements.txt
          fi
          
          # Apply fixes for Node.js
          if [ -f package.json ]; then
            npm audit fix --force || true
          fi
          
          git add requirements.txt package.json package-lock.json 2>/dev/null || true
          git commit -m "chore: auto-patch vulnerable dependencies [skip ci]" || echo "No changes"
          git push origin $BRANCH
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
      
      - name: Run tests
        if: steps.audit.outputs.VULNERABLE == 'true'
        run: |
          # Run test suite to verify patches don't break anything
          if [ -f pytest.ini ] || [ -f pyproject.toml ] || ls tests/*.py 2>/dev/null; then
            pip install pytest pytest-asyncio
            python -m pytest tests/ -v --tb=short || exit 1
          fi
          if [ -f package.json ]; then
            npm test || true
          fi
      
      - name: Create Pull Request
        if: steps.audit.outputs.VULNERABLE == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ steps.patch.outputs.branch }}
          base: main
          title: "🔧 Auto-patch: Fix vulnerable dependencies"
          body: |
            Automated dependency vulnerability patch.
            
            **Vulnerabilities fixed:**
            ```
            $(cat fixable.txt 2>/dev/null || echo "See audit.json")
            ```
            
            **Test status:** All tests passed ✅
            
            **Auto-generated** — review and merge.
          labels: |
            dependencies
            security
            automated
          draft: false
      
      - name: Auto-merge if enabled
        if: steps.audit.outputs.VULNERABLE == 'true' && github.event.inputs.auto_merge == 'true'
        run: |
          gh pr merge --auto --squash --delete-branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit
          path: |
            audit.json
            npm_audit.json
          retention-days: 30
      
      - name: Post summary
        run: |
          echo "## Dependency Audit Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Python vulnerabilities | ${{ steps.audit.outputs.vulnerabilities }} |" >> $GITHUB_STEP_SUMMARY
          echo "| PR created | ${{ steps.audit.outputs.VULNERABLE == 'true' && 'Yes' || 'No' }} |" >> $GITHUB_STEP_SUMMARY